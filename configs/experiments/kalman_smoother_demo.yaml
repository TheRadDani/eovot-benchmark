experiment:
  name: "kalman-smoother-demo"
  description: >
    Compares raw MOSSE and KCF trackers against their Kalman-smoothed
    counterparts on synthetic sequences.  Demonstrates reduced temporal jitter
    and confidence-based coast mode.
  seed: 42

dataset:
  loader: SyntheticDataset
  name: "Synthetic-Linear"
  num_sequences: 10
  num_frames: 200
  motion: "linear"

trackers:
  - name: MOSSE
    params: {}

  - name: KCF
    params:
      learning_rate: 0.075

  # Kalman-smoothed variants must be constructed in Python; see
  # scripts/run_kalman_demo.py for a runnable example.
  # Listed here for documentation purposes.
  # - name: Kalman(MOSSE)
  #   params:
  #     process_noise: 1.0
  #     measurement_noise: 4.0
  #     gate_threshold: 16.0
  #     max_coast_frames: 10

benchmark:
  verbose: true
  tdp_watts: null

reporting:
  formats:
    - json
    - markdown
  print_summary: true
