# KCF hyperparameter sweep experiment configuration.
#
# Run from the repository root:
#
#   python scripts/sweep_trackers.py \
#       --tracker KCF \
#       --grid learning_rate=0.05,0.075,0.125,0.2 padding=1.0,1.5,2.0 \
#       --num-sequences 10 --num-frames 100 --motion linear
#
# This evaluates 4 × 3 = 12 KCF configurations on 10 synthetic sequences,
# ranks them by success AUC, and writes results to results/sweeps/.

sweep:
  tracker: KCF
  dataset: synthetic
  motion: linear
  num_sequences: 10
  num_frames: 100
  seed: 42

# Cartesian product: 4 × 3 = 12 configurations
param_grid:
  learning_rate:
    - 0.05
    - 0.075
    - 0.125
    - 0.2
  padding:
    - 1.0
    - 1.5
    - 2.0
