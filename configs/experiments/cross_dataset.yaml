# Cross-dataset evaluation configuration for EOVOT.
#
# Evaluates all listed trackers on every dataset and computes an
# Aggregate Performance Score (APS = weighted mean success AUC).
#
# Usage:
#   python scripts/cross_eval.py --config configs/experiments/cross_dataset.yaml
#
# To target real datasets, replace the SyntheticDataset entries with
# OTBDataset / GOT10kDataset / LaSOTDataset and point root: to your data.

experiment:
  name: "cross-dataset-comparison"
  verbose: true
  # Limit sequences per dataset during development; null = all sequences
  max_sequences: null
  # CPU TDP in Watts for energy estimation (null = disabled)
  # Set to your device's TDP: 6.0 for RPi4, 15.0 for laptop, 28.0 for desktop
  tdp_watts: null
  # Resume a partially-completed run (skip already-evaluated combinations)
  resume: false

# Dataset definitions.  Use `weight` to up- or down-weight a dataset in APS.
# Higher weight = more influence on the final ranking.
# Absent weight = 1.0.
datasets:
  - name: Synthetic-Linear
    loader: SyntheticDataset
    num_sequences: 10
    num_frames: 100
    motion: "linear"
    weight: 1.0

  - name: Synthetic-Circular
    loader: SyntheticDataset
    num_sequences: 10
    num_frames: 100
    motion: "circular"
    weight: 1.0

  - name: Synthetic-Random
    loader: SyntheticDataset
    num_sequences: 10
    num_frames: 100
    motion: "random"
    weight: 1.5   # harder sequences get higher weight

  # Uncomment and point to real data to include actual benchmarks:
  # - name: OTB100
  #   loader: OTBDataset
  #   root: /data/OTB100
  #   weight: 2.0

  # - name: GOT-10k-val
  #   loader: GOT10kDataset
  #   root: /data/GOT-10k
  #   split: val
  #   max_sequences: 180
  #   weight: 2.0

trackers:
  - name: MOSSE
    params: {}

  - name: KCF
    params:
      learning_rate: 0.075

  - name: CSRT
    params: {}

  # Uncomment to include all available classical trackers:
  # - name: MIL
  #   params: {}
  # - name: MedianFlow
  #   params: {}
  # - name: CamShift
  #   params: {}
  # - name: LKOpticalFlow
  #   params: {}
