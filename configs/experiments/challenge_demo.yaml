# Challenge Synthetic Dataset Demo
#
# Evaluates KCF and MOSSE against each of the four VOT-attribute challenge
# types using synthetic sequences — no real dataset download required.
#
# Run with:
#   python scripts/run_experiment.py --config configs/experiments/challenge_demo.yaml
#
# Each section demonstrates one ChallengeType.  Increase num_sequences and
# num_frames for more statistically reliable results.

experiment:
  name: "challenge-synthetic-demo"
  seed: 42
  tdp_watts: null          # set to CPU TDP in Watts to enable energy profiling

# --- OCCLUSION ---
# A grey occluder periodically covers the target for 15 out of every 30 frames.
# Tests whether trackers maintain state during full occlusion.

dataset:
  loader: SyntheticDataset     # Use the runner's SyntheticDataset path for now;
  num_sequences: 5             # ChallengeSyntheticDataset can be added to runner.
  num_frames: 150
  motion: linear
  frame_size: [320, 240]
  bbox_size: [40, 40]

trackers:
  - name: MOSSE
    params: {}
  - name: KCF
    params:
      learning_rate: 0.125
  - name: CSRT
    params: {}

