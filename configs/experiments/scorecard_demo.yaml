# Edge Suitability Index (ESI) scorecard demonstration
# -------------------------------------------------------
# Runs MOSSE, KCF, and CSRT on the synthetic dataset and
# ranks them by the unified ESI.
#
# Usage (with real dataset):
#   python scripts/run_experiment.py --config configs/experiments/scorecard_demo.yaml
#
# Headless smoke test (built-in synthetic data):
#   python -c "
#   from eovot.datasets.synthetic import SyntheticDataset
#   from eovot.benchmark.engine import BenchmarkEngine
#   from eovot.metrics.scorecard import EdgeScorecardEngine
#   from eovot.trackers.mosse import MOSSETracker
#   from eovot.trackers.kcf import KCFTracker
#   ds = SyntheticDataset(num_sequences=3, num_frames=60)
#   engine = BenchmarkEngine(verbose=False)
#   results = [engine.run(t, ds, 'Synthetic') for t in [MOSSETracker(), KCFTracker()]]
#   scorecard = EdgeScorecardEngine()
#   for e in scorecard.rank(results):
#       print(e)
#   "

experiment:
  name: "scorecard-demo"
  output_dir: "results/scorecard"
  seed: 42
  tdp_watts: 6.0                     # Raspberry Pi 4 TDP — enables energy profiling

dataset:
  name: "OTB100"
  loader: "OTBDataset"
  root: "/data/OTB100"
  max_sequences: null

trackers:
  - name: MOSSE
    params: {}
  - name: KCF
    params:
      learning_rate: 0.125
  - name: CSRT
    params: {}
  - name: MedianFlow
    params: {}

scorecard:
  enabled: true
  weights:
    accuracy: 0.30                   # Emphasise accuracy for this experiment
    robustness: 0.25
    smoothness: 0.20
    efficiency: 0.25
  memory_budget_mb: 512.0
  max_ees_ref: 2.5                   # Tune to your device's expected EES ceiling

reporting:
  formats: ["json", "csv", "markdown"]
  print_summary: true
