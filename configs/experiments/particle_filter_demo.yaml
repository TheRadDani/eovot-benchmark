# EOVOT Experiment: Particle Filter vs. Classical Trackers (Synthetic Dataset)
#
# Runs the new ParticleFilter tracker alongside MOSSE and KCF on a synthetic
# dataset so users can reproduce the stochastic-vs-deterministic comparison
# without downloading an external benchmark dataset.
#
# Usage:
#   python -c "
#   import yaml
#   from eovot.experiment.runner import ExperimentRunner
#   with open('configs/experiments/particle_filter_demo.yaml') as f:
#       cfg = yaml.safe_load(f)
#   runner = ExperimentRunner(output_dir='results/experiments', resume=False)
#   out = runner.run_from_config(cfg)
#   print(out['leaderboard'])
#   "
#
# Expected operating points (approximate, 200-particle PF, Intel Core i7):
#   Tracker          mIoU   FPS    Notes
#   ---------------  -----  -----  -----------------------------------------
#   MOSSE             0.78  500+   Deterministic correlation filter; fastest
#   KCF               0.81  300+   Kernelized CF; best FPS/accuracy balance
#   ParticleFilter    0.70   50    Stochastic; robust to multi-modal posteriors
#
# Tune ``n_particles`` to trade speed for accuracy on your target device:
#   n_particles: 50   →  ~150 FPS on Raspberry Pi 4
#   n_particles: 200  →  ~50  FPS on Raspberry Pi 4
#   n_particles: 500  →  ~20  FPS on Raspberry Pi 4

experiment:
  name: "particle-filter-demo"
  seed: 42
  tdp_watts: null   # set to 6.0 for Raspberry Pi 4, 15.0 for laptop

dataset:
  loader: SyntheticDataset
  num_sequences: 10
  num_frames: 150
  frame_size: [320, 240]
  bbox_size: [50, 40]
  motion: random    # random motion stresses the PF's motion prior most
  seed: 42

trackers:
  - name: MOSSE
    params: {}

  - name: KCF
    params:
      learning_rate: 0.075

  - name: ParticleFilter
    params:
      n_particles: 200
      motion_noise_px: 10.0
      scale_noise: 0.02
      n_bins: 16
      resample_threshold: 0.5
      update_rate: 0.05
      seed: 42
