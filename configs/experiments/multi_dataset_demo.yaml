# EOVOT multi-dataset cross-evaluation experiment (synthetic demo)
#
# Runs MOSSE and KCF across three synthetic motion patterns to demonstrate
# cross-dataset aggregation with frame-count-weighted metrics.
#
# Run with:
#   python scripts/run_multi_dataset.py --config configs/experiments/multi_dataset_demo.yaml
#
# For real datasets, replace "synthetic" loaders with:
#   - loader: OTBDataset  root: /data/OTB100  name: OTB100
#   - loader: GOT10kDataset  root: /data/GOT-10k  split: val  name: GOT-10k-val

experiment:
  name: "multi-dataset-cross-eval"
  tdp_watts: null        # set to CPU TDP (e.g. 6.0 for RPi4) to enable energy profiling
  max_sequences: null    # set to e.g. 5 for a quick smoke test

datasets:
  - loader: synthetic
    name: Syn-Linear
    n_sequences: 5
    n_frames: 120
    motion: linear

  - loader: synthetic
    name: Syn-Random
    n_sequences: 5
    n_frames: 120
    motion: random

  - loader: synthetic
    name: Syn-Circular
    n_sequences: 5
    n_frames: 120
    motion: circular

trackers:
  - name: MOSSE
    params:
      learning_rate: 0.125

  - name: KCF
    params:
      learning_rate: 0.125

  - name: MedianFlow
    params: {}

  - name: CamShift
    params: {}
